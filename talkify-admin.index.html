<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Talkify Admin — Secure Login</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4"><main class="w-full max-w-md rounded-3xl border border-slate-700 bg-slate-900 p-7 shadow-2xl"><div class="text-center mb-7"><div class="mx-auto mb-3 grid h-16 w-16 place-items-center rounded-2xl bg-teal-500 text-3xl">☎</div><h1 class="text-2xl font-black">Talkify Admin Portal</h1><p class="mt-2 text-sm text-slate-400">Master Admin secure authentication</p></div><div id="login"><label class="text-sm">Admin Email</label><input id="email" type="email" autocomplete="username" class="mt-1 mb-4 w-full rounded-xl border border-slate-700 bg-slate-800 p-3" placeholder="admin@example.com"><label class="text-sm">Password</label><input id="password" type="password" autocomplete="current-password" class="mt-1 mb-4 w-full rounded-xl border border-slate-700 bg-slate-800 p-3" placeholder="Password"><button id="loginBtn" onclick="login()" class="w-full rounded-xl bg-teal-500 p-3 font-bold text-slate-950">Login as Master</button><div class="mt-4 flex justify-between text-sm"><button onclick="view('setup')" class="text-teal-300">First-time Setup</button><button onclick="view('forgot')" class="text-slate-400">Forgot Password</button></div></div><div id="setup" class="hidden"><h2 class="mb-3 text-xl font-bold">Create Master Admin</h2><p class="mb-3 text-xs text-amber-300">শুধু প্রথম Admin তৈরির জন্য। একবার তৈরি হলে setup বন্ধ হয়ে যাবে।</p><input id="setupEmail" type="email" class="mb-3 w-full rounded-xl bg-slate-800 p-3" placeholder="Admin email"><input id="setupPw" type="password" class="mb-3 w-full rounded-xl bg-slate-800 p-3" placeholder="Password (12+ characters)"><input id="setupPw2" type="password" class="mb-3 w-full rounded-xl bg-slate-800 p-3" placeholder="Repeat password"><button onclick="setupAdmin()" class="w-full rounded-xl bg-teal-500 p-3 font-bold text-slate-950">Create Master Admin</button><button onclick="view('login')" class="mt-3 w-full p-2">Back</button></div><div id="forgot" class="hidden"><h2 class="mb-3 text-xl font-bold">Password recovery</h2><p class="mb-3 text-sm text-slate-400">এই bundle-এ email delivery/reset token এখনো কনফিগার করা নেই।</p><input id="forgotEmail" type="email" class="mb-3 w-full rounded-xl bg-slate-800 p-3" placeholder="Admin email"><button onclick="recover()" class="w-full rounded-xl bg-teal-500 p-3 font-bold text-slate-950">Request recovery</button><button onclick="view('login')" class="mt-3 w-full p-2">Back</button></div><p id="msg" role="status" class="mt-5 min-h-6 text-center text-sm"></p><p class="mt-5 text-center text-xs text-slate-500">Use HTTPS and set SESSION_SECRET + DATABASE_URL in Render.</p></main><script>
const API_BASE_URL=location.origin;
async function request(path,method='GET',body){const r=await fetch(API_BASE_URL+path,{method,credentials:'include',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.message||'Request failed');return d}function message(t,ok=false){const e=document.getElementById('msg');e.textContent=t;e.className='mt-5 min-h-6 text-center text-sm '+(ok?'text-emerald-400':'text-rose-300')}function view(v){['login','setup','forgot'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==v));message('')}async function login(){try{const d=await request('/api/admin/login','POST',{email:email.value.trim(),password:password.value});if(d.ok){message('Login সফল। Dashboard খুলছে…',true);location.href='dashboard.html'}}catch(e){message(e.message)}}async function setupAdmin(){if(setupPw.value!==setupPw2.value)return message('দুটি password এক নয়।');try{await request('/api/admin/setup','POST',{email:setupEmail.value.trim(),password:setupPw.value});message('Admin তৈরি হয়েছে। Dashboard খুলছে…',true);setTimeout(()=>location.href='dashboard.html',500)}catch(e){message(e.message)}}async function recover(){try{const d=await request('/api/admin/forgot-password','POST',{email:forgotEmail.value.trim()});message(d.message||'Recovery not configured')}catch(e){message(e.message)}}Promise.all([request('/api/admin/session'),request('/api/admin/setup-status')]).then(([sessionData,setupData])=>{if(sessionData.authenticated){location.href='dashboard.html';return;}if(setupData.setupRequired){view('setup');message('প্রথমে Master Admin তৈরি করুন।',true);}else{view('login');}}).catch(()=>{message('Backend-এর সঙ্গে সংযোগ হচ্ছে না। Render service, CORS এবং API URL পরীক্ষা করুন।');});document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!login.classList.contains('hidden'))login()});
</script></body></html>
