<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Talkify Admin — Secure Login</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4">

<main class="w-full max-w-md rounded-3xl border border-slate-700 bg-slate-900 p-7 shadow-2xl">

  <div class="text-center mb-7">
    <div class="mx-auto mb-3 grid h-16 w-16 place-items-center rounded-2xl bg-teal-500 text-3xl">☎</div>
    <h1 class="text-2xl font-black">Talkify Admin Portal</h1>
    <p class="mt-2 text-sm text-slate-400">Master Admin secure authentication</p>
  </div>

  <!-- LOGIN -->
  <div id="login">
    <label class="text-sm" for="email">Admin Email</label>
    <input id="email" type="email" autocomplete="username"
      class="mt-1 mb-4 w-full rounded-xl border border-slate-700 bg-slate-800 p-3"
      placeholder="admin@example.com">

    <label class="text-sm" for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password"
      class="mt-1 mb-4 w-full rounded-xl border border-slate-700 bg-slate-800 p-3"
      placeholder="Password">

    <button id="loginBtn" onclick="loginAdmin()"
      class="w-full rounded-xl bg-teal-500 p-3 font-bold text-slate-950">
      Login as Master
    </button>

    <div class="mt-4 flex justify-between text-sm">
      <button onclick="viewPage('setup')" class="text-teal-300">First-time Setup</button>
      <button onclick="viewPage('forgot')" class="text-slate-400">Forgot Password</button>
    </div>
  </div>

  <!-- FIRST-TIME SETUP -->
  <div id="setup" class="hidden">
    <h2 class="mb-3 text-xl font-bold">Create Master Admin</h2>

    <p class="mb-3 text-xs text-amber-300">
      শুধু প্রথম Admin তৈরির জন্য। একবার তৈরি হলে setup বন্ধ হয়ে যাবে।
    </p>

    <input id="setupEmail" type="email" autocomplete="email"
      class="mb-3 w-full rounded-xl bg-slate-800 p-3"
      placeholder="Admin email">

    <input id="setupPw" type="password" autocomplete="new-password"
      class="mb-3 w-full rounded-xl bg-slate-800 p-3"
      placeholder="Password (12+ characters)">

    <input id="setupPw2" type="password" autocomplete="new-password"
      class="mb-3 w-full rounded-xl bg-slate-800 p-3"
      placeholder="Repeat password">

    <button id="setupBtn" onclick="setupAdmin()"
      class="w-full rounded-xl bg-teal-500 p-3 font-bold text-slate-950">
      Create Master Admin
    </button>

    <button onclick="viewPage('login')" class="mt-3 w-full p-2">Back</button>
  </div>

  <!-- FORGOT PASSWORD -->
  <div id="forgot" class="hidden">
    <h2 class="mb-3 text-xl font-bold">Password recovery</h2>

    <p class="mb-3 text-sm text-slate-400">
      এই bundle-এ email delivery/reset token এখনো কনফিগার করা নেই।
    </p>

    <input id="forgotEmail" type="email" autocomplete="email"
      class="mb-3 w-full rounded-xl bg-slate-800 p-3"
      placeholder="Admin email">

    <button onclick="recoverPassword()"
      class="w-full rounded-xl bg-teal-500 p-3 font-bold text-slate-950">
      Request recovery
    </button>

    <button onclick="viewPage('login')" class="mt-3 w-full p-2">Back</button>
  </div>

  <p id="msg" role="status" aria-live="polite"
    class="mt-5 min-h-6 text-center text-sm"></p>

  <p class="mt-5 text-center text-xs text-slate-500">
    Use HTTPS and set SESSION_SECRET + DATABASE_URL in Render.
  </p>
</main>

<script>
'use strict';

/*
 * Talkify Admin Login
 * API server: Render
 *
 * NOTE:
 * Keep this URL consistent with your actual Render service.
 */
const API_BASE = 'https://talkify-global-network.onrender.com';

const API = {
  setupStatus: '/api/admin/setup-status',
  session: '/api/admin/session',
  login: '/api/admin/login',
  setup: '/api/admin/setup',
  forgotPassword: '/api/admin/forgot-password'
};

const DASHBOARD_PAGE = 'dashboard.html';

const $ = id => document.getElementById(id);

function showMessage(text, success = false) {
  const element = $('msg');
  element.textContent = text;
  element.className =
    'mt-5 min-h-6 text-center text-sm ' +
    (success ? 'text-emerald-400' : 'text-rose-300');
}

function viewPage(page) {
  ['login', 'setup', 'forgot'].forEach(id => {
    $(id).classList.toggle('hidden', id !== page);
  });
  showMessage('');
}

async function apiRequest(path, method = 'GET', body) {
  const options = {
    method,
    credentials: 'include',
    headers: {
      'Accept': 'application/json'
    }
  };

  if (body !== undefined) {
    options.headers['Content-Type'] = 'application/json';
    options.body = JSON.stringify(body);
  }

  const response = await fetch(API_BASE + path, options);

  let data = {};
  try {
    data = await response.json();
  } catch (_) {
    data = {};
  }

  if (!response.ok) {
    throw new Error(
      data.message ||
      data.error ||
      ('Request failed (HTTP ' + response.status + ')')
    );
  }

  return { response, data };
}

/*
 * Check existing admin session and first-time setup status.
 */
async function checkAdminStatus() {
  viewPage('login');
  showMessage('সার্ভারের অবস্থা যাচাই হচ্ছে…', true);

  try {
    const sessionResult = await apiRequest(API.session);
    const sessionData = sessionResult.data;

    if (
      sessionData.authenticated === true &&
      sessionData.admin
    ) {
      window.location.href = DASHBOARD_PAGE;
      return;
    }

    const statusResult = await apiRequest(API.setupStatus);
    const statusData = statusResult.data;

    if (
      statusData.ok === true &&
      statusData.setupRequired === true
    ) {
      viewPage('setup');
      showMessage(
        'প্রথমবারের জন্য Master Admin তৈরি করুন।',
        true
      );
      return;
    }

    if (
      statusData.ok === true &&
      statusData.setupRequired === false
    ) {
      viewPage('login');
      showMessage('Admin লগইন করুন।', true);
      return;
    }

    viewPage('login');
    showMessage(
      'Setup status যাচাই করা যায়নি। Server response পরীক্ষা করুন।'
    );

  } catch (error) {
    console.error('Admin status check failed:', error);

    viewPage('login');
    showMessage(
      'সার্ভারের সাথে সংযোগ করা যাচ্ছে না। Render URL, server status এবং CORS settings পরীক্ষা করুন।'
    );
  }
}

/*
 * Admin login
 */
async function loginAdmin() {
  const email = $('email').value.trim();
  const password = $('password').value;

  if (!email || !password) {
    showMessage('Admin email ও password লিখুন।');
    return;
  }

  const button = $('loginBtn');
  button.disabled = true;
  button.textContent = 'Logging in…';

  try {
    const result = await apiRequest(API.login, 'POST', {
      email,
      password
    });

    if (result.data.ok === true) {
      showMessage('Login সফল। Dashboard খুলছে…', true);
      window.location.href = DASHBOARD_PAGE;
      return;
    }

    showMessage(result.data.message || 'Login সফল হয়নি।');

  } catch (error) {
    showMessage(error.message || 'Login ব্যর্থ হয়েছে।');
  } finally {
    button.disabled = false;
    button.textContent = 'Login as Master';
  }
}

/*
 * Create the first Master Admin.
 */
async function setupAdmin() {
  const email = $('setupEmail').value.trim();
  const password = $('setupPw').value;
  const password2 = $('setupPw2').value;

  if (!email || !password || !password2) {
    showMessage('সবগুলো ঘর পূরণ করুন।');
    return;
  }

  if (password.length < 12) {
    showMessage('Password কমপক্ষে 12 অক্ষরের হতে হবে।');
    return;
  }

  if (password !== password2) {
    showMessage('দুটি password এক নয়।');
    return;
  }

  const button = $('setupBtn');
  button.disabled = true;
  button.textContent = 'Creating…';

  try {
    const result = await apiRequest(API.setup, 'POST', {
      email,
      password
    });

    if (result.data.ok === true) {
      showMessage(
        'Master Admin তৈরি হয়েছে। Dashboard খুলছে…',
        true
      );

      window.location.href = DASHBOARD_PAGE;
      return;
    }

    showMessage(result.data.message || 'Admin তৈরি করা যায়নি।');

  } catch (error) {
    showMessage(error.message || 'Admin তৈরি করা যায়নি।');
  } finally {
    button.disabled = false;
    button.textContent = 'Create Master Admin';
  }
}

/*
 * Password recovery
 *
 * The supplied server configuration does not establish a working
 * email delivery/reset-token flow. This request may therefore fail.
 */
async function recoverPassword() {
  const email = $('forgotEmail').value.trim();

  if (!email) {
    showMessage('Admin email লিখুন।');
    return;
  }

  try {
    const result = await apiRequest(
      API.forgotPassword,
      'POST',
      { email }
    );

    showMessage(
      result.data.message ||
      'Recovery request-এর উত্তর পাওয়া গেছে।'
    );

  } catch (error) {
    showMessage(
      error.message ||
      'Password recovery এখনো কনফিগার করা নেই।'
    );
  }
}

/*
 * Enter key support
 */
document.addEventListener('keydown', event => {
  if (event.key !== 'Enter') return;

  if (!$('login').classList.contains('hidden')) {
    loginAdmin();
  } else if (!$('setup').classList.contains('hidden')) {
    setupAdmin();
  } else if (!$('forgot').classList.contains('hidden')) {
    recoverPassword();
  }
});

/*
 * Start
 */
checkAdminStatus();
</script>

</body>
  </html>
